name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# CPU-only: the test jobs install the `cpu` dependency group instead of the
# default `cuda` one, so CUDA and multi-GPU tests skip themselves. `uv run
# --no-sync` keeps uv from switching back to the default groups.
jobs:
  test:
    name: test (Python ${{ matrix.python-version }}, locked deps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-group cuda --group cpu
      - name: Run tests
        run: uv run --no-sync pytest

  test-lowest:
    # Re-resolves with the lowest versions allowed by pyproject.toml for direct
    # dependencies (torch, numpy, safetensors, ...) to keep the lower bounds honest.
    name: test (Python 3.10, lowest direct deps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-suffix: lowest
      - name: Install
        run: uv sync --resolution lowest-direct --no-group cuda --group cpu
      - name: Show resolved versions
        run: uv pip list
      - name: Run tests
        run: uv run --no-sync pytest

  test-torch-nightly:
    name: test (Python 3.13, torch nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: nightly
      - name: Install
        run: |
          uv sync --locked --no-group cuda --group cpu
          uv pip install --pre --upgrade-package torch torch --index-url https://download.pytorch.org/whl/nightly/cpu
          uv run --no-sync python -c "import torch; print(torch.__version__)"
      - name: Run tests
        run: uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check uv.lock is up to date
        run: uv lock --check
      - name: Ruff lint
        run: uv run --locked --only-group lint ruff check .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv --no-project "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" --torch-backend cpu dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import torch_checkpointing as m; print(m.__version__)"
