[build-system]
requires = ["uv_build>=0.11.15,<0.13.0"]
build-backend = "uv_build"

[project]
name = "torch_checkpointing"
version = "0.1.0"
description = "A high-performance, distributed-training-ready checkpointing library for PyTorch models"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Meta Platforms, Inc."},
]
keywords = [
    "pytorch",
    "checkpointing",
    "distributed-training",
    "distributed-checkpointing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    # Older torch lacks private APIs imported here (< 2.9), or its torch.save
    # keeps the saved storages alive until the next GC cycle (2.9).
    "torch>=2.10",
    "numpy>=1.21.6",
    "safetensors>=0.4.3",
    "typing_extensions>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/meta-pytorch/torch_checkpointing"
Repository = "https://github.com/meta-pytorch/torch_checkpointing"
Issues = "https://github.com/meta-pytorch/torch_checkpointing/issues"

[dependency-groups]
test = [
    "pytest>=8.0",
    # Both imported by torch.testing._internal.common_utils; torch only declares
    # setuptools on every Python version from 2.14 onwards.
    "expecttest>=0.2.1",
    "setuptools>=77.0.3",
]
lint = ["ruff>=0.6"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
# Which torch build `uv sync` installs; pick one. `cuda` (the default) is the
# PyPI build, which is CUDA-enabled on Linux. `cpu` is the CPU-only build, for
# CI and machines without a GPU: `uv sync --no-group cuda --group cpu`.
cuda = ["torch>=2.10"]
cpu = ["torch>=2.10"]

[tool.uv]
required-version = ">=0.11.15"
default-groups = ["dev", "cuda"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]
# Only resolve versions with wheels for these platforms. Without this, the
# lowest torch on the CPU index (`2.10.0`, not `2.10.0+cpu`) is macOS-only.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]

# Scoped to the `cpu` group, so it never applies when another project installs
# this one from git or a path. Published metadata depends on plain `torch`.
[tool.uv.sources]
torch = { index = "pytorch-cpu", group = "cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


# Pyright type checker configuration
[tool.pyright]
include = ["torch_checkpointing", "tests"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/build", "**/dist", "**/*.egg-info"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportGeneralTypeIssues = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportIncompatibleMethodOverride = "warning"

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpus_needed_1: requires 1 GPU",
    "gpus_needed_2: requires 2 GPUs",
    "gpus_needed_4: requires 4 GPUs",
]

[tool.ruff]
target-version = "py310"
src = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export symbols on purpose.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
order-by-type = false

[tool.test-selector.extra-deps]

# BEGIN GENERATED buck-manual-deps -- do not edit by hand
# Regenerate: export_buck_manual_deps.py
"torch_checkpointing/state_transformations.py" = ["tests/test_state_transformations.py"]
# END GENERATED buck-manual-deps
